name: Android build

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nalabel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/schemas/
          if-no-files-found: ignore

  # 실제 APK 를 안드로이드 14 에뮬레이터에 깔고 눌러 본다(크래시 확인 + 스크린샷).
  # 결과는 아티팩트와 ci-screens 브랜치에 올린다.
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nalabel-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/smoke.sh app-debug.apk ci-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: ci-out/
          if-no-files-found: ignore

      - name: Push screenshots to ci-screens branch
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# 에뮬레이터 실행 결과\n\n커밋 %s (자동 생성, 매 실행마다 덮어씀)\n' "${GITHUB_SHA::7}" > README.md
          git add -A
          git commit -qm "emulator smoke ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
