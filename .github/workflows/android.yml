name: Android build

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 업로드 키가 Secrets 에 있으면 release(AAB)를 그 키로 서명한다. 없으면 debug 키(업로드 불가).
      - name: Restore upload keystore
        id: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=upload" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug-NOT-for-upload" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK, release APK and release AAB
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nalabel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 플레이 콘솔에 올리는 파일. 이름에 서명 상태를 붙인다.
      - uses: actions/upload-artifact@v4
        with:
          name: nalabel-release-aab-${{ steps.keystore.outputs.signed }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nalabel-release-apk-${{ steps.keystore.outputs.signed }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/
            app/schemas/
          if-no-files-found: ignore

  # 출시될 것과 같은 release 빌드(R8 축소 적용)를 안드로이드 14 에뮬레이터에 깔고 눌러 본다.
  # 크래시 확인 + 스크린샷. 결과는 아티팩트와 ci-screens 브랜치에 올린다.
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nalabel-release-apk-*
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/smoke.sh app-release.apk ci-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: ci-out/
          if-no-files-found: ignore

      - name: Push screenshots to ci-screens branch
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# 에뮬레이터 실행 결과 (release 빌드)\n\n커밋 %s (자동 생성, 매 실행마다 덮어씀)\n' "${GITHUB_SHA::7}" > README.md
          git add -A
          git commit -qm "emulator smoke ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
